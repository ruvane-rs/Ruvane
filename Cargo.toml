[package]
name = "ruvane"
version = "0.1.0-alpha.40"
edition = "2024"
rust-version = "1.85"
description = "A dependency-free Rust web framework with typed rendering, routing, embedded assets, and local serving."
license = "MIT"
repository = "https://github.com/ruvane-rs/Ruvane"
readme = "README.md"
keywords = ["html", "ssr", "web", "rendering", "zero-dependencies"]
categories = ["web-programming", "template-engine"]
publish = ["crates-io"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/**",
    "/web/**",
]

[workspace]
members = ["browser"]
default-members = ["."]
resolver = "2"

[lib]
path = "src/lib.rs"
