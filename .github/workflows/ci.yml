name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Check zero dependencies for every target and feature
        run: test "$(cargo tree --offline --locked --all-features --target all --edges normal,build,dev --prefix none | wc -l | tr -d ' ')" = 1
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test library, network behavior, examples and documentation
        run: |
          cargo test --offline --locked --all-targets
          cargo test --offline --locked --doc
      - name: Clippy
        run: cargo clippy --offline --locked --all-targets -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --offline --locked --no-deps
