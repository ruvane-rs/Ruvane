name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check zero dependencies for every target and feature
        run: python3 tools/check_first_party.py
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test library, network behavior, examples and documentation
        run: |
          cargo test --workspace --offline --locked --all-targets
          cargo test --workspace --offline --locked --doc
      - name: Clippy
        run: cargo clippy --workspace --offline --locked --all-targets -- -D warnings
      - name: Build and execute first-party Wasm
        run: |
          cargo build --offline --locked -p ruvane-browser --target wasm32-unknown-unknown --release
          node --test browser/tests/bridge.test.mjs
          node --test browser/tests/application.test.mjs
          node --test browser/tests/progressive.test.mjs
          cargo check --offline --locked -p ruvane-browser --no-default-features --target wasm32-unknown-unknown
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --offline --locked --no-deps
